name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies (GSL and MPI)
      run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev libgsl-dev

    - name: Clean before serial build
      run: make clean
    
    - name: make serial
      run: make serial

    # Deliberately no clean between the two builds.  This sequence used to
    # produce an MPI binary linked out of serial-compiled objects, which ran
    # and reported zero of every species; the two modes now keep separate
    # object trees, and building them back to back here keeps that true.
    - name: make mpi (immediately after serial, no clean)
      run: make mpi
